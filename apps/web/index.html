<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230E0071'/%3E%3Cstop offset='1' stop-color='%230070FC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 18l3.5-3.5L16 18l3.5-3.5L23 18' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='10' r='2' fill='white'/%3E%3C/svg%3E" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs (which
         breaks this fixed full-viewport layout); iOS still allows accessibility
         pinch-zoom regardless. user-scalable is intentionally NOT disabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- browser chrome tint = stage background (--bg-stage) per OS scheme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF2FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070A1C" />
    <!-- Add to Home Screen: run standalone. Status bar style 'default' keeps the
         OS clock readable on the light-first app (black-translucent would force
         white status text over the lavender background); the safe-area env()
         insets in index.css already handle the translucent case if ever enabled. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SingleInterface" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>SingleInterface — Zero Business Loss</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
